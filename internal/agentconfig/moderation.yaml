# content_moderation — per-sub-agent tier + prompt config.
#
# AGENT-DRIVEN tiering (CR mana-is-quota-not-model-selector 2026-06-01): this
# YAML declares each sub-agent's tier and prompt version. The model itself is
# env-only: the crew constructs ONE model-gateway client per sub-agent (it
# routes through chora-model-gateway per ADR-177 — the gateway resolves the
# logical model id) from that sub-agent's REQUIRED model env var, and forwards
# the optional *_FALLBACK_MODELS comma list as the agent-DECLARED fallback
# chain (same shape as qgen).
#
# Mana is a token-budget QUOTA system (manaplugin gate), NOT a model selector —
# the old tieredmodelplugin is no longer registered. See
# feedback_mana_is_quota_not_model_selector.
#
# Tiers (mirroring qgen's convention):
#   HIGH  = reasoning / judgement-heavy
#   CHEAP = classification / labelling
# The deployment serves ONE text model, named by the env vars below, so both
# tiers name that same route; the tier label is the config's shape, NOT a model
# selector (mana is a quota, see below).
#
# Moderation is a P6 Reflection pair (Moderator → Critic). Per-agent tiering:
#   - moderator: CHEAP. First-pass classification — labels the post
#     pass | refine | reject. A bounded-label triage task; the cheap tier
#     is the correct fit and keeps the high-volume first pass inexpensive.
#   - critic:    HIGH. LLM-as-judge reflection that emits the FINAL verdict the
#     chora-sharing service acts on. It must catch what the Moderator missed
#     (off-platform solicitation, over-flagging, consistency) and justify a
#     confirm/override — judgement-heavy reasoning → the high tier.
#
# The moderator's gateway logical_model_id comes from the REQUIRED
# MODERATION_MODERATOR_MODEL env var (optional MODERATION_MODERATOR_FALLBACK_MODELS
# chain); the critic's from the REQUIRED MODERATION_CRITIC_MODEL env var
# (optional MODERATION_CRITIC_FALLBACK_MODELS chain). Boot fails loud when a
# model var is unset — there is no literal fallback.
#
# prompt_version selects the composer template version (currently the
# embedded v1).
agent: content_moderation
sub_agents:
  moderator:
    tier: cheap
    prompt_version: v1
  critic:
    tier: high
    prompt_version: v1
